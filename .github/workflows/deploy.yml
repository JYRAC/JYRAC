name: Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Publish to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Cloudflare Pages deployment
        uses: Khan/cloudflare-pages-build-action@v1
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          cloudflareToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountEmail: ${{ secrets.CLOUDFLARE_EMAIL }}
          project: "your-project-name" # Cloudflare Pagesのプロジェクト名に変更してください

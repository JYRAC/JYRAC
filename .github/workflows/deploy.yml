name: Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Publish to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cloudflare Pages にビルド＆デプロイを指示し、完了まで待機
      - name: Trigger and Wait for Cloudflare Pages Build
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: "your-project-name" # ★実際のCloudflare Pagesプロジェクト名に変更
          # GitHubのアクション側ではなくCloudflare側でビルドを完結させるため、
          # ソースコードを送信してCloudflareにビルドを委任します
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
